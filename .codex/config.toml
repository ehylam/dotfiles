model = "gpt-5.5"
personality = "pragmatic"
model_reasoning_effort = "medium"
approvals_reviewer = "guardian_subagent"
service_tier = "fast"

[features]
hooks = true
terminal_resize_reflow = true
goals = true
prevent_idle_sleep = true
js_repl = false

[mcp_servers.shopify-dev-mcp]
command = "npx"
args = ["-y", "@shopify/dev-mcp@1.14.0"]

[mcp_servers.pencil]
enabled = false
command = "/Applications/Pencil.app/Contents/Resources/app.asar.unpacked/out/mcp-server-darwin-arm64"
args = ["--app", "desktop"]

[mcp_servers.browser]
enabled = false
command = "npx"
args = ["@browsermcp/mcp@0.1.3"]
startup_timeout_sec = 15.0

[mcp_servers.chrome-devtools]
enabled = false
command = "npx"
args = ["chrome-devtools-mcp@1.2.0"]
startup_timeout_sec = 15.0

[mcp_servers.context7]
command = "/Users/eric/.dotfiles/.codex/scripts/context7-mcp.sh"
startup_timeout_sec = 15.0

[mcp_servers.github-mcp]
command = "/Users/eric/.dotfiles/.codex/scripts/github-mcp.sh"
startup_timeout_sec = 60.0

[mcp_servers.harvester]
enabled = false
command = "node"
args = ["/Users/eric/Documents/mcps/shopify-backend-mcp/build/index.js"]
startup_timeout_sec = 15.0

[mcp_servers.harvester.env]
NODE_PATH = "/Users/eric/Documents/mcps/shopify-backend-mcp/node_modules"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.76", "--isolated"]
startup_timeout_sec = 15.0

[tui]
status_line = ["five-hour-limit", "context-remaining", "model-with-reasoning", "git-branch", "run-state"]
status_line_use_colors = true

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[plugins."ponytail@ponytail"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."figma@openai-curated"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = false

[desktop]
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true

[desktop.open-in-target-preferences]
global = "ghostty"
